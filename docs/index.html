<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог КОД по продуктам</title>
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #e4e7eb;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --row-hover: #f3f4f6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    flex: 0 0 auto;
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; flex: 1; }
  header .source { font-size: 11px; color: var(--muted); }
  #search {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    width: 280px;
  }
  main {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 340px 1fr;
    overflow: hidden;
  }
  #sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
  }
  #sidebar h2 {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--muted);
    margin: 14px 0 6px;
    letter-spacing: 0.04em;
  }
  #sidebar h2:first-child { margin-top: 0; }
  #product {
    width: 100%;
    padding: 7px 8px;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
  }
  .opt-block {
    border-top: 1px solid var(--border);
    padding: 10px 0;
  }
  .opt-block:first-of-type { border-top: none; }
  .opt-title {
    font-weight: 600;
    font-size: 12px;
    margin-bottom: 6px;
  }
  .opt-radio, .opt-multi {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .opt-pill {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 4px 10px;
    border-radius: 14px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }
  .opt-pill.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .opt-pill.binary-yes.active { background: #16a34a; border-color: #16a34a; }
  .opt-pill.binary-no.active  { background: #6b7280; border-color: #6b7280; }
  .opt-binary {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .opt-binary button {
    background: #fff;
    border: none;
    padding: 5px 14px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text);
  }
  .opt-binary button.active {
    background: var(--accent);
    color: #fff;
  }
  .opt-binary button:not(:last-child) { border-right: 1px solid var(--border); }
  #content { display: flex; flex-direction: column; overflow: hidden; }
  #stats {
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .counter { font-size: 14px; font-weight: 600; }
  .counter .muted { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .cat-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--border); }
  .cat-bar .seg { height: 100%; cursor: pointer; transition: filter 120ms; }
  .cat-bar .seg:hover { filter: brightness(0.92); }
  .cat-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; align-items: center; }
  .cat-legend .item { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; padding: 2px 4px; border-radius: 3px; }
  .cat-legend .item:hover { background: var(--border); }
  .cat-legend .item.dimmed { opacity: 0.4; }
  .cat-legend .item.selected .dot { box-shadow: 0 0 0 2px rgba(0,0,0,0.18); }
  .cat-legend .reset { margin-left: 8px; cursor: pointer; color: #1a73e8; font-size: 11px; text-decoration: underline; }
  .cat-legend .reset:hover { color: #1558b0; }
  .cat-legend .dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  #table-wrap { flex: 1; overflow: auto; padding: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead { position: sticky; top: 0; background: #fafbfc; z-index: 1; }
  th {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr.doc-row { cursor: pointer; }
  tr.doc-row:hover { background: var(--row-hover); }
  td.col-row { color: var(--muted); width: 36px; }
  td.col-name { font-weight: 500; min-width: 260px; }
  td.col-code code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; background: #f3f4f6; padding: 1px 5px; border-radius: 3px; }
  td.col-req { text-transform: uppercase; font-size: 10px; color: var(--muted); width: 50px; }
  td.col-cat { width: 160px; white-space: nowrap; }
  td.col-comment { width: 280px; padding: 4px 6px; }
  textarea.comment-input {
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    line-height: 1.4;
    resize: none;
    padding: 4px 6px;
    border-radius: 4px;
    min-height: 24px;
    overflow: hidden;
    box-sizing: border-box;
  }
  textarea.comment-input::placeholder { color: #c1c5cc; }
  textarea.comment-input:hover { border-color: var(--border); background: #fff; }
  textarea.comment-input:focus { border-color: var(--accent); outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
  textarea.comment-input.has-text { background: #fffbe6; border-color: #fde68a; }
  textarea.comment-input.has-text:focus { background: #fff; }

  .toolbar {
    flex: 0 0 auto;
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .toolbar .reviewer-label { font-size: 12px; color: var(--muted); }
  .toolbar .reviewer-input {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    width: 220px;
    background: #fff;
    color: var(--text);
  }
  .toolbar button {
    padding: 6px 14px;
    font-size: 13px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    color: var(--text);
    white-space: nowrap;
  }
  .toolbar button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .toolbar button.primary:hover { background: #1d4ed8; }
  .toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
  .toolbar .spacer { flex: 1; }
  .toolbar .comments-stat { font-size: 12px; color: var(--muted); }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  tr.expanded td { background: #fafbfc; border-bottom: none; }
  tr.detail-row td { padding: 0 10px 12px 10px; background: #fafbfc; border-bottom: 1px solid var(--border); }
  .detail-box {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 12px;
  }
  .detail-label {
    font-weight: 600;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 10px;
  }
  .detail-label:first-child { margin-top: 0; }
  .condition-raw {
    white-space: pre-wrap;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    background: #f7f8fa;
    padding: 8px 10px;
    border-radius: 4px;
    margin: 4px 0;
    max-height: 400px;
    overflow: auto;
  }
  .parsed-cond {
    display: inline-block;
    font-size: 11px;
    background: #eef2ff;
    color: #3730a3;
    padding: 2px 8px;
    border-radius: 10px;
    margin: 2px 4px 2px 0;
  }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
  .reset-link {
    font-size: 11px;
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    margin-left: 8px;
  }

  /* Category colours */
  .cat-CLIENT_BASE     { background: #d4edda; color: #155724; }
  .cat-CLIENT_OPTION   { background: #cce5ff; color: #004085; }
  .cat-BANK            { background: #e2e3e5; color: #383d41; }
  .cat-PACKAGE         { background: #fff3cd; color: #856404; }
  .cat-SAT_CZZ         { background: #d1ecf1; color: #0c5460; }
  .cat-SAT_TARGETED    { background: #d4d0ff; color: #2a2670; }

  .bar-CLIENT_BASE     { background: #8fd19e; }
  .bar-CLIENT_OPTION   { background: #8ab4f8; }
  .bar-BANK            { background: #b0b4b8; }
  .bar-PACKAGE         { background: #ffd866; }
  .bar-SAT_CZZ         { background: #85cfe0; }
  .bar-SAT_TARGETED    { background: #a8a0f0; }

  /* ---------- Юр. ревью (legal review) ---------- */
  /* Колонка и сайдбар-секция «Юр. ревью» по умолчанию скрыты; включаются на body.lr-on */
  th.col-lr-th, td.col-lr { display: none; }
  body.lr-on th.col-lr-th, body.lr-on td.col-lr { display: table-cell; }
  td.col-lr { width: 150px; white-space: nowrap; }
  #legal-review-block { display: none; }
  body.lr-on #legal-review-block { display: block; }
  #toolbar-legal-summary { display: none; }
  body.lr-on #toolbar-legal-summary { display: inline-block; }

  .lr-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #fff;
    white-space: nowrap;
  }
  .lr-na {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    color: #9aa1a8;
    background: #f0f1f3;
    border: 1px dashed #cdd1d6;
    white-space: nowrap;
  }
  .lr-detail-block {
    margin-top: 10px;
    padding: 10px 12px;
    background: #fffaf0;
    border: 1px solid #fde7b7;
    border-radius: 6px;
  }
  .lr-detail-block .lr-detail-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .lr-detail-block .lr-detail-head .lr-detail-title {
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .lr-detail-text { font-size: 12px; line-height: 1.5; white-space: pre-wrap; color: var(--text); }

  #legal-review-block .lr-filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 8px;
  }
  .lr-filter-pill {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    cursor: pointer;
    user-select: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    line-height: 1.2;
  }
  .lr-filter-pill .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
  }
  .lr-filter-pill .count {
    color: var(--muted);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
  }
  .lr-filter-pill.active {
    background: #eef2ff;
    border-color: #94a3f3;
    color: #2a2670;
  }
  .lr-filter-pill.muted .dot { background: #cdd1d6; border: 1px dashed #9aa1a8; }
  #legal-review-block .lr-quick {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 11px;
    margin-top: 4px;
  }
  #legal-review-block .lr-quick a {
    color: var(--accent);
    text-decoration: underline;
    cursor: pointer;
  }

  /* Сводка — модальное окно */
  #lr-summary-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #lr-summary-overlay.show { display: flex; }
  .lr-summary-modal {
    background: #fff;
    width: min(880px, 92vw);
    max-height: 86vh;
    border-radius: 10px;
    box-shadow: 0 18px 50px rgba(15, 23, 42, 0.25);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .lr-summary-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .lr-summary-header h3 { margin: 0; font-size: 15px; }
  .lr-summary-header .meta { color: var(--muted); font-size: 12px; }
  .lr-summary-header .close-btn {
    margin-left: auto;
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 22px;
    color: var(--muted);
    padding: 0 4px;
  }
  .lr-summary-body { padding: 14px 18px; overflow: auto; }
  .lr-group { margin-bottom: 14px; }
  .lr-group .lr-group-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .lr-group .lr-group-head .lr-group-name { font-weight: 600; font-size: 13px; }
  .lr-group .lr-group-head .lr-group-count { color: var(--muted); font-size: 12px; }
  .lr-group ul { margin: 0; padding-left: 20px; }
  .lr-group ul li { font-size: 12px; line-height: 1.55; margin: 2px 0; }
  .lr-group ul li .lr-item-row { color: var(--muted); font-size: 11px; }
  .lr-group ul li .lr-item-comment { color: var(--muted); display: block; padding: 2px 0 4px 0; }
</style>
</head>
<body>
<header>
  <h1>Каталог КОД по продуктам</h1>
  <div class="source">Банк ДОМ.РФ · v.24.04.2026 · итерация v10 · обновлено 2026-06-04</div>
  <input id="search" type="search" placeholder="Поиск по имени документа…" autocomplete="off">
</header>
<main>
  <aside id="sidebar">
    <h2>Продукт</h2>
    <select id="product"></select>
    <h2>Опции сделки <span class="reset-link" id="reset-options">Сбросить</span></h2>
    <div id="filters"></div>
    <div id="legal-review-block">
      <h2>Юр. ревью (ПС) <span class="reset-link" id="lr-reset">Все</span></h2>
      <div class="lr-filter-row" id="lr-filter"></div>
      <div class="lr-quick">
        <a id="lr-quick-open">Только с открытыми вопросами</a>
      </div>
    </div>
  </aside>
  <section id="content">
    <div id="stats">
      <div class="counter" id="counter"></div>
      <div class="cat-bar" id="cat-bar"></div>
      <div class="cat-legend" id="cat-legend"></div>
    </div>
    <div class="toolbar">
      <span class="reviewer-label">ФИО рецензента:</span>
      <input id="reviewer" class="reviewer-input" type="text" placeholder="Ваше имя" maxlength="80" autocomplete="off">
      <button id="export-xlsx" class="primary" type="button">Скачать xlsx с комментариями</button>
      <button id="toolbar-legal-summary" type="button">Сводка по юр. ревью</button>
      <span class="comments-stat" id="comments-stat"></span>
      <span class="spacer"></span>
      <button id="reset-comments" type="button">Сбросить комментарии (текущий продукт)</button>
    </div>
    <div id="table-wrap">
      <table id="docs">
        <thead>
          <tr>
            <th>№</th>
            <th>Наименование документа</th>
            <th>Код</th>
            <th>Обяз.</th>
            <th>Категория</th>
            <th class="col-lr-th">Юр. оценка</th>
            <th>Комментарий</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
</main>
<div id="lr-summary-overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="lr-summary-modal">
    <div class="lr-summary-header">
      <h3>Сводка по юр. ревью (ПС)</h3>
      <span class="meta" id="lr-summary-meta"></span>
      <button class="close-btn" id="lr-summary-close" type="button" aria-label="Закрыть">×</button>
    </div>
    <div class="lr-summary-body" id="lr-summary-body"></div>
  </div>

при первичной идентификации а бумаге","conditions_parsed":[],"category":"CLIENT_BASE","dispute":null,"legal_review":null},{"row":9001,"name":"Заявление на оказание оценочных услуг","template_name":"Заявление на оказание оценочных услуг","template_code":"APPLICATION_FOR_APPRAISAL_SERVICES","required":"нет","condition_raw":"ДДУ","conditions_parsed":[{"dimension":"credit_purpose","value":"ДДУ"}],"category":"CLIENT_OPTION","dispute":null,"legal_review":null},{"row":9002,"name":"СОПД продавца недвижимости","template_name":"СОПД продавца недвижимости","template_code":"SELLER_USER_AGREEMENT","required":"да","condition_raw":"","conditions_parsed":[],"category":"CLIENT_BASE","dispute":null,"legal_review":null}]}}}</script>
<script>
(function () {
  "use strict";

  const DATA = JSON.parse(document.getElementById("data").textContent);
  const { taxonomy, products } = DATA;
  const CAT_NAME = Object.fromEntries(taxonomy.categories.map(c => [c.id, c.name]));
  const CAT_ORDER = taxonomy.categories.map(c => c.id);
  const DIMS = taxonomy.dimensions;

  // Юр. ревью: словари статусов и наборы для фильтра
  const LR_STATUSES = taxonomy.legal_review_statuses || [];
  const LR_BY_ID = Object.fromEntries(LR_STATUSES.map(s => [s.id, s]));
  const LR_ORDER = LR_STATUSES.map(s => s.id);
  // «Открытые вопросы» — статусы, которые требуют действия от кросс-команды
  const LR_OPEN = new Set(["MANDATORY_DISCUSS", "OPTIONAL", "CONDITIONAL", "NEED_SAMPLE", "PENDING"]);
  const LR_NA_ID = "__NA__"; // псевдо-id для документов без юр. комментария

  const productNames = Object.keys(products);

  function productHasLegalReview(productName) {
    return (products[productName].documents || []).some(d => d.legal_review);
  }

  const COMMENTS_KEY = "kod_comments_v1";
  const REVIEWER_KEY = "kod_reviewer_v1";

  function loadComments() {
    try {
      const raw = localStorage.getItem(COMMENTS_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveComments() {
    try { localStorage.setItem(COMMENTS_KEY, JSON.stringify(state.comments)); }
    catch (e) { console.warn("Не удалось сохранить комментарии:", e); }
  }
  function getComment(product, row) {
    const byProduct = state.comments[product];
    return byProduct ? (byProduct[row] || "") : "";
  }
  function setComment(product, row, text) {
    if (text) {
      if (!state.comments[product]) state.comments[product] = {};
      state.comments[product][row] = text;
    } else if (state.comments[product]) {
      delete state.comments[product][row];
      if (Object.keys(state.comments[product]).length === 0) delete state.comments[product];
    }
    saveComments();
  }
  function productCommentCount(product) {
    return state.comments[product] ? Object.keys(state.comments[product]).length : 0;
  }
  function totalCommentCount() {
    let n = 0;
    for (const p of Object.keys(state.comments)) n += Object.keys(state.comments[p]).length;
    return n;
  }

  const state = {
    product: null,
    options: {},
    expanded: new Set(),
    search: "",
    comments: loadComments(),
    legalFilter: null,         // Set<statusId | "__NA__"> или null = «все»
    categoryFilter: null,      // Set<categoryId> или null = «все» (итерация 8)
  };

  const $product = document.getElementById("product");
  const $filters = document.getElementById("filters");
  const $tbody = document.getElementById("tbody");
  const $counter = document.getElementById("counter");
  const $catBar = document.getElementById("cat-bar");
  const $catLegend = document.getElementById("cat-legend");
  const $search = document.getElementById("search");
  const $resetOptions = document.getElementById("reset-options");
  const $reviewer = document.getElementById("reviewer");
  const $exportBtn = document.getElementById("export-xlsx");
  const $resetComments = document.getElementById("reset-comments");
  const $commentsStat = document.getElementById("comments-stat");
  const $lrFilter = document.getElementById("lr-filter");
  const $lrReset = document.getElementById("lr-reset");
  const $lrQuickOpen = document.getElementById("lr-quick-open");
  const $lrSummaryBtn = document.getElementById("toolbar-legal-summary");
  const $lrOverlay = document.getElementById("lr-summary-overlay");
  const $lrSummaryBody = document.getElementById("lr-summary-body");
  const $lrSummaryMeta = document.getElementById("lr-summary-meta");
  const $lrSummaryClose = document.getElementById("lr-summary-close");

  function init() {
    for (const name of productNames) {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      $product.appendChild(opt);
    }
    $product.addEventListener("change", () => setProduct($product.value));
    $search.addEventListener("input", () => {
      state.search = $search.value.trim().toLowerCase();
      render();
    });
    $resetOptions.addEventListener("click", () => {
      resetOptions(state.product);
      renderFilters();
      render();
    });

    $reviewer.value = localStorage.getItem(REVIEWER_KEY) || "";
    $reviewer.addEventListener("input", () => {
      try { localStorage.setItem(REVIEWER_KEY, $reviewer.value); } catch (e) {}
    });
    $exportBtn.addEventListener("click", exportXLSX);
    $resetComments.addEventListener("click", resetCurrentProductComments);

    $lrReset.addEventListener("click", () => { state.legalFilter = null; renderLegalFilter(); render(); });
    $lrQuickOpen.addEventListener("click", () => {
      state.legalFilter = new Set([...LR_OPEN]);
      renderLegalFilter();
      render();
    });
    $lrSummaryBtn.addEventListener("click", openLegalSummary);
    $lrSummaryClose.addEventListener("click", closeLegalSummary);
    $lrOverlay.addEventListener("click", (e) => {
      if (e.target === $lrOverlay) closeLegalSummary();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && $lrOverlay.classList.contains("show")) closeLegalSummary();
    });

    setProduct(productNames[0]);
  }

  function defaultOption(dimId) {
    const meta = DIMS[dimId];
    if (meta.type === "multi") return new Set();
    return meta.default;
  }

  function resetOptions(productName) {
    const p = products[productName];
    state.options = {};
    for (const dimId of p.applicable_dimensions) {
      state.options[dimId] = defaultOption(dimId);
    }
    state.expanded = new Set();
  }

  function setProduct(name) {
    state.product = name;
    resetOptions(name);
    state.legalFilter = null;
    state.categoryFilter = null;
    document.body.classList.toggle("lr-on", productHasLegalReview(name));
    renderFilters();
    renderLegalFilter();
    render();
  }

  function renderFilters() {
    const p = products[state.product];
    $filters.innerHTML = "";

    // Порядок измерений: как в taxonomy.dimensions, фильтруя по applicable
    const ordered = Object.keys(DIMS).filter(d => p.applicable_dimensions.includes(d));

    for (const dimId of ordered) {
      const meta = DIMS[dimId];
      const block = document.createElement("div");
      block.className = "opt-block";
      const title = document.createElement("div");
      title.className = "opt-title";
      title.textContent = meta.name;
      block.appendChild(title);

      if (meta.type === "single") {
        const wrap = document.createElement("div");
        wrap.className = "opt-radio";
        const values = p.domain[dimId] || [];
        for (const v of values) {
          const pill = document.createElement("button");
          pill.className = "opt-pill" + (state.options[dimId] === v ? " active" : "");
          pill.textContent = v;
          pill.addEventListener("click", () => {
            state.options[dimId] = v;
            renderFilters();
            render();
          });
          wrap.appendChild(pill);
        }
        block.appendChild(wrap);
      } else if (meta.type === "binary") {
        const wrap = document.createElement("div");
        wrap.className = "opt-binary";
        for (const v of ["Нет", "Да"]) {
          const btn = document.createElement("button");
          btn.textContent = v;
          if (state.options[dimId] === v) btn.classList.add("active");
          btn.addEventListener("click", () => {
            state.options[dimId] = v;
            renderFilters();
            render();
          });
          wrap.appendChild(btn);
        }
        block.appendChild(wrap);
      } else if (meta.type === "multi") {
        const wrap = document.createElement("div");
        wrap.className = "opt-multi";
        const values = p.domain[dimId] || [];
        for (const v of values) {
          const pill = document.createElement("button");
          const sel = state.options[dimId];
          const active = sel.has(v);
          pill.className = "opt-pill" + (active ? " active" : "");
          pill.textContent = v;
          pill.addEventListener("click", () => {
            const s = state.options[dimId];
            if (s.has(v)) s.delete(v); else s.add(v);
            renderFilters();
            render();
          });
          wrap.appendChild(pill);
        }
        block.appendChild(wrap);
      }
      $filters.appendChild(block);
    }
  }

  function docMatches(doc) {
    if (state.search) {
      const inName = (doc.name || "").toLowerCase().includes(state.search);
      const inComment = getComment(state.product, doc.row).toLowerCase().includes(state.search);
      const lrText = doc.legal_review ? doc.legal_review.comment.toLowerCase() : "";
      const inLr = lrText.includes(state.search);
      if (!inName && !inComment && !inLr) return false;
    }
    if (state.legalFilter) {
      const docStatus = doc.legal_review ? doc.legal_review.status : LR_NA_ID;
      if (!state.legalFilter.has(docStatus)) return false;
    }
    if (state.categoryFilter && !state.categoryFilter.has(doc.category)) return false;
    const conds = doc.conditions_parsed || [];
    if (conds.length === 0) return true;

    // Группируем условия по group||dimension. Внутри группы — OR (даже между
    // разными измерениями, как для pledge: материнский капитал ИЛИ залоговый счёт);
    // между группами — AND. Backward-compatible: без поля group → group=dimension
    // (одна dimension с несколькими values ведёт себя как прежде, OR внутри).
    const groups = {};
    for (const c of conds) {
      const gid = c.group || c.dimension;
      (groups[gid] = groups[gid] || []).push(c);
    }
    for (const gid of Object.keys(groups)) {
      const items = groups[gid];
      let anyApplicable = false, groupPass = false;
      for (const c of items) {
        const meta = DIMS[c.dimension];
        const cur = state.options[c.dimension];
        if (cur === undefined) continue;  // dim не применим к продукту — игнорируем условие
        anyApplicable = true;
        const ok = (meta && meta.type === "multi") ? cur.has(c.value) : (cur === c.value);
        if (ok) { groupPass = true; break; }
      }
      // Группа провалена, только если есть применимые условия и ни одно не сошлось.
      // Группа из одних неприменимых условий → vacuous true (как раньше continue).
      if (anyApplicable && !groupPass) return false;
    }
    return true;
  }

  function render() {
    const p = products[state.product];
    const visible = p.documents.filter(docMatches);
    renderStats(visible, p.documents.length);
    renderTable(visible);
    updateToolbar();
  }

  // ------------------ Юр. ревью: фильтр в сайдбаре ------------------

  function legalCountsForCurrentProduct() {
    const counts = {};
    counts[LR_NA_ID] = 0;
    for (const sid of LR_ORDER) counts[sid] = 0;
    const docs = (products[state.product] || {}).documents || [];
    for (const d of docs) {
      const sid = d.legal_review ? d.legal_review.status : LR_NA_ID;
      counts[sid] = (counts[sid] || 0) + 1;
    }
    return counts;
  }

  function renderLegalFilter() {
    if (!productHasLegalReview(state.product)) {
      $lrFilter.innerHTML = "";
      return;
    }
    const counts = legalCountsForCurrentProduct();
    const items = [];
    for (const sid of LR_ORDER) {
      if ((counts[sid] || 0) === 0) continue;
      const meta = LR_BY_ID[sid];
      items.push({id: sid, label: meta.short, color: meta.color, count: counts[sid], muted: false});
    }
    if ((counts[LR_NA_ID] || 0) > 0) {
      items.push({id: LR_NA_ID, label: "Н/Д", color: null, count: counts[LR_NA_ID], muted: true});
    }
    $lrFilter.innerHTML = "";
    for (const it of items) {
      const pill = document.createElement("span");
      pill.className = "lr-filter-pill" + (it.muted ? " muted" : "");
      const isActive = !state.legalFilter || state.legalFilter.has(it.id);
      if (isActive) pill.classList.add("active");
      pill.innerHTML =
        `<span class="dot"${it.color ? ` style="background:${it.color};"` : ""}></span>` +
        `<span>${escapeHtml(it.label)}</span>` +
        `<span class="count">${it.count}</span>`;
      pill.addEventListener("click", () => toggleLegalFilter(it.id));
      $lrFilter.appendChild(pill);
    }
  }

  function toggleLegalFilter(id) {
    if (!state.legalFilter) {
      // переход из «все» в режим селекции — все, кроме нажатого
      state.legalFilter = new Set(LR_ORDER);
      state.legalFilter.add(LR_NA_ID);
      state.legalFilter.delete(id);
    } else if (state.legalFilter.has(id)) {
      state.legalFilter.delete(id);
      if (state.legalFilter.size === 0) state.legalFilter = null;
    } else {
      state.legalFilter.add(id);
      // если включены все возможные — сбросить в null (= «все»)
      const counts = legalCountsForCurrentProduct();
      const all = Object.keys(counts).filter(k => counts[k] > 0);
      if (all.every(k => state.legalFilter.has(k))) state.legalFilter = null;
    }
    renderLegalFilter();
    render();
  }

  // ------------------ Сводка по юр. ревью (модальное окно) ------------------

  function openLegalSummary() {
    if (!productHasLegalReview(state.product)) return;
    const docs = products[state.product].documents || [];
    const groups = new Map();
    for (const sid of LR_ORDER) groups.set(sid, []);
    groups.set(LR_NA_ID, []);
    for (const d of docs) {
      const sid = d.legal_review ? d.legal_review.status : LR_NA_ID;
      groups.get(sid).push(d);
    }
    const totalDocs = docs.length;
    const reviewed = docs.filter(d => d.legal_review).length;
    $lrSummaryMeta.textContent = `${state.product.trim()} · ${reviewed}/${totalDocs} с юр. оценкой`;

    let html = "";
    const renderGroup = (sid, label, color, list) => {
      if (list.length === 0) return "";
      const dot = color
        ? `<span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color};"></span>`
        : `<span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#cdd1d6;border:1px dashed #9aa1a8;"></span>`;
      const items = list.map(d => {
        const cmt = d.legal_review ? d.legal_review.comment : "Юристы не оценивали этот документ.";
        return `<li><span class="lr-item-row">№ ${d.row - 1}</span> · <strong>${escapeHtml(d.name || "")}</strong>
            <span class="lr-item-comment">${escapeHtml(cmt)}</span></li>`;
      }).join("");
      return `<div class="lr-group">
        <div class="lr-group-head">${dot}<span class="lr-group-name">${escapeHtml(label)}</span><span class="lr-group-count">${list.length}</span></div>
        <ul>${items}</ul>
      </div>`;
    };
    for (const sid of LR_ORDER) {
      const meta = LR_BY_ID[sid];
      html += renderGroup(sid, meta.name, meta.color, groups.get(sid));
    }
    html += renderGroup(LR_NA_ID, "Н/Д — юристы не оценивали", null, groups.get(LR_NA_ID));
    $lrSummaryBody.innerHTML = html;
    $lrOverlay.classList.add("show");
    $lrOverlay.setAttribute("aria-hidden", "false");
  }

  function closeLegalSummary() {
    $lrOverlay.classList.remove("show");
    $lrOverlay.setAttribute("aria-hidden", "true");
  }

  function updateToolbar() {
    const cur = productCommentCount(state.product);
    const total = totalCommentCount();
    $resetComments.disabled = cur === 0;
    let txt = "";
    if (total > 0) {
      txt = `комментариев: ${cur}`;
      if (total > cur) txt += ` (всего: ${total})`;
    }
    $commentsStat.textContent = txt;
  }

  function autosize(ta) {
    ta.style.height = "auto";
    ta.style.height = ta.scrollHeight + "px";
  }

  function renderStats(visible, total) {
    $counter.innerHTML =
      `<span>${visible.length} из ${total} документов</span>` +
      (state.search ? `<span class="muted">поиск: «${escapeHtml(state.search)}»</span>` : "");

    const counts = {};
    for (const d of visible) counts[d.category] = (counts[d.category] || 0) + 1;
    const total_ = visible.length || 1;
    const cf = state.categoryFilter;

    $catBar.innerHTML = "";
    for (const cat of CAT_ORDER) {
      const n = counts[cat] || 0;
      if (n === 0) continue;
      const seg = document.createElement("div");
      seg.className = `seg bar-${cat}`;
      seg.style.flex = String(n / total_);
      seg.title = `${CAT_NAME[cat]}: ${n} — кликни для фильтра`;
      seg.addEventListener("click", () => toggleCategoryFilter(cat));
      $catBar.appendChild(seg);
    }

    $catLegend.innerHTML = "";
    for (const cat of CAT_ORDER) {
      const n = counts[cat] || 0;
      const item = document.createElement("span");
      const isSelected = cf ? cf.has(cat) : false;
      const isDimmed = cf ? !cf.has(cat) : (n === 0);
      const cls = ["item"];
      if (isDimmed) cls.push("dimmed");
      if (isSelected) cls.push("selected");
      item.className = cls.join(" ");
      item.innerHTML = `<span class="dot bar-${cat}"></span>${escapeHtml(CAT_NAME[cat])} <b>${n}</b>`;
      item.title = cf ? (isSelected ? "Кликни, чтобы убрать из фильтра" : "Кликни, чтобы добавить в фильтр") : "Кликни для фильтра по этой категории";
      item.addEventListener("click", () => toggleCategoryFilter(cat));
      $catLegend.appendChild(item);
    }
    if (cf) {
      const reset = document.createElement("span");
      reset.className = "reset";
      reset.textContent = "Все";
      reset.title = "Сбросить фильтр по категориям";
      reset.addEventListener("click", () => { state.categoryFilter = null; render(); });
      $catLegend.appendChild(reset);
    }
  }

  function toggleCategoryFilter(catId) {
    if (!state.categoryFilter) {
      state.categoryFilter = new Set([catId]);
    } else if (state.categoryFilter.has(catId)) {
      state.categoryFilter.delete(catId);
      if (state.categoryFilter.size === 0) state.categoryFilter = null;
    } else {
      state.categoryFilter.add(catId);
    }
    render();
  }

  function renderTable(visible) {
    $tbody.innerHTML = "";
    if (visible.length === 0) {
      const tr = document.createElement("tr");
      const colspanEmpty = document.body.classList.contains("lr-on") ? 7 : 6;
      tr.innerHTML = `<td colspan="${colspanEmpty}" class="empty">Под текущие опции ни один документ не подходит.</td>`;
      $tbody.appendChild(tr);
      return;
    }
    for (const d of visible) {
      const tr = document.createElement("tr");
      tr.className = "doc-row" + (state.expanded.has(d.row) ? " expanded" : "");
      tr.addEventListener("click", (e) => {
        if (e.target.closest("td.col-comment")) return;
        if (state.expanded.has(d.row)) state.expanded.delete(d.row);
        else state.expanded.add(d.row);
        render();
      });
      const commentText = getComment(state.product, d.row);
      const lrCellHtml = (() => {
        if (d.legal_review) {
          const meta = LR_BY_ID[d.legal_review.status];
          const color = (meta && meta.color) || "#888";
          const label = (meta && meta.short) || d.legal_review.status;
          const title = (meta && meta.name) || d.legal_review.status;
          return `<span class="lr-badge" style="background:${color};" title="${escapeHtml(title)}">${escapeHtml(label)}</span>`;
        }
        return `<span class="lr-na" title="Юристы не оценивали этот документ">Н/Д</span>`;
      })();
      tr.innerHTML = `
        <td class="col-row">${d.row}</td>
        <td class="col-name">${escapeHtml(d.name || "")}</td>
        <td class="col-code">${d.template_code ? `<code>${escapeHtml(d.template_code)}</code>` : ""}</td>
        <td class="col-req">${escapeHtml(d.required || "")}</td>
        <td class="col-cat"><span class="badge cat-${d.category}">${escapeHtml(CAT_NAME[d.category] || d.category)}</span></td>
        <td class="col-lr">${lrCellHtml}</td>
        <td class="col-comment"><textarea class="comment-input${commentText ? " has-text" : ""}" rows="1" placeholder="Ваш комментарий…">${escapeHtml(commentText)}</textarea></td>
      `;
      $tbody.appendChild(tr);

      const ta = tr.querySelector("textarea.comment-input");
      autosize(ta);
      ta.addEventListener("click", (e) => e.stopPropagation());
      ta.addEventListener("input", () => {
        setComment(state.product, d.row, ta.value);
        ta.classList.toggle("has-text", !!ta.value);
        autosize(ta);
        updateToolbar();
      });

      if (state.expanded.has(d.row)) {
        const detail = document.createElement("tr");
        detail.className = "detail-row";
        const parsedHtml = (d.conditions_parsed || []).map(c =>
          `<span class="parsed-cond">${escapeHtml(DIMS[c.dimension] ? DIMS[c.dimension].name : c.dimension)}: ${escapeHtml(c.value)}</span>`
        ).join("");
        let lrBlockHtml = "";
        if (productHasLegalReview(state.product)) {
          if (d.legal_review) {
            const meta = LR_BY_ID[d.legal_review.status];
            const color = (meta && meta.color) || "#888";
            const label = (meta && meta.name) || d.legal_review.status;
            lrBlockHtml = `
              <div class="lr-detail-block">
                <div class="lr-detail-head">
                  <span class="lr-badge" style="background:${color};">${escapeHtml(label)}</span>
                  <span class="lr-detail-title">Комментарий юристов (ПС)</span>
                </div>
                <div class="lr-detail-text">${escapeHtml(d.legal_review.comment)}</div>
              </div>`;
          } else {
            lrBlockHtml = `
              <div class="lr-detail-block" style="background:#f7f8fa;border-color:var(--border);">
                <div class="lr-detail-head">
                  <span class="lr-na">Н/Д</span>
                  <span class="lr-detail-title">Юристы не оценивали этот документ</span>
                </div>
              </div>`;
          }
        }
        const colspan = document.body.classList.contains("lr-on") ? 7 : 6;
        detail.innerHTML = `
          <td colspan="${colspan}">
            <div class="detail-box">
              <div class="detail-label">Шаблон</div>
              <div>${escapeHtml(d.template_name || "—")}</div>
              <div class="detail-label">Условие формирования (F)</div>
              <div class="condition-raw">${escapeHtml(d.condition_raw || "—")}</div>
              ${parsedHtml ? `<div class="detail-label">Распарсенные условия</div><div>${parsedHtml}</div>` : ""}
              ${lrBlockHtml}
            </div>
          </td>
        `;
        $tbody.appendChild(detail);
      }
    }
  }

  function resetCurrentProductComments() {
    const product = state.product;
    if (!product || productCommentCount(product) === 0) return;
    const label = product.trim();
    if (!confirm(`Удалить все комментарии для продукта "${label}"? Действие нельзя отменить.`)) return;
    delete state.comments[product];
    saveComments();
    render();
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  // ------------------ XLSX export ------------------

  function exportXLSX() {
    try {
      const sheets = buildAllSheets();
      const xlsxBytes = buildXLSX(sheets);
      const blob = new Blob([xlsxBytes], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});

      const reviewer = ($reviewer.value || "").trim();
      const sanitized = reviewer.replace(/[^\p{L}\p{N}_-]+/gu, "_").replace(/^_+|_+$/g, "").slice(0, 60);
      const date = new Date().toISOString().slice(0, 10);
      const filename = sanitized
        ? `КОД_комментарии_${sanitized}_${date}.xlsx`
        : `КОД_комментарии_${date}.xlsx`;

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 0);
    } catch (e) {
      console.error(e);
      alert("Не удалось собрать xlsx: " + (e && e.message ? e.message : e));
    }
  }

  function buildAllSheets() {
    const sheets = [];
    const HEADERS = ["№", "Наименование (тип) документа", "Наименование шаблона",
                     "Код шаблона", "Обязательность", "Условие формирования",
                     "Категория", "Комментарий пользователя"];
    for (const productName of productNames) {
      const p = products[productName];
      const rows = [HEADERS.slice()];
      p.documents.forEach((doc, idx) => {
        rows.push([
          idx + 1,
          doc.name || "",
          doc.template_name || "",
          doc.template_code || "",
          doc.required || "",
          doc.condition_raw || "",
          doc.category || "",
          getComment(productName, doc.row),
        ]);
      });
      sheets.push({name: productName, rows: rows, widths: [6, 50, 50, 22, 14, 60, 18, 40], wrapCols: [5, 7]});
    }

    const taxRows = [["ID категории", "Название"]];
    for (const c of taxonomy.categories) taxRows.push([c.id, c.name]);
    sheets.push({name: "_Таксономия", rows: taxRows, widths: [22, 40], wrapCols: []});

    const optRows = [["Продукт", "Измерение", "Название", "Встреченные значения"]];
    for (const productName of productNames) {
      const p = products[productName];
      for (const dimId of (p.applicable_dimensions || [])) {
        const meta = DIMS[dimId];
        const values = (p.domain[dimId] || []).join("; ");
        optRows.push([productName, dimId, meta ? meta.name : dimId, values]);
      }
    }
    sheets.push({name: "_Опции по продуктам", rows: optRows, widths: [30, 22, 30, 50], wrapCols: [3]});

    return sheets;
  }

  function escapeXml(s) {
    return String(s)
      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
  function escapeXmlAttr(s) {
    return escapeXml(s).replace(/"/g, "&quot;");
  }

  function colLetter(i) {
    let s = "";
    let n = i;
    while (true) {
      s = String.fromCharCode(65 + (n % 26)) + s;
      n = Math.floor(n / 26) - 1;
      if (n < 0) break;
    }
    return s;
  }

  function buildSheetXml(sheet) {
    const rows = sheet.rows;
    const widths = sheet.widths || [];
    const wrapCols = new Set(sheet.wrapCols || []);
    let xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
    xml += '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
    if (widths.length > 0) {
      xml += '<cols>';
      for (let i = 0; i < widths.length; i++) {
        xml += `<col min="${i+1}" max="${i+1}" width="${widths[i]}" customWidth="1"/>`;
      }
      xml += '</cols>';
    }
    xml += '<sheetData>';
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r];
      xml += `<row r="${r+1}">`;
      for (let c = 0; c < row.length; c++) {
        const v = row[c];
        if (v === null || v === undefined || v === "") continue;
        const ref = colLetter(c) + (r+1);
        const isHeader = r === 0;
        const isWrap = !isHeader && wrapCols.has(c);
        const styleIdx = isHeader ? 1 : (isWrap ? 2 : 0);
        const sAttr = styleIdx > 0 ? ` s="${styleIdx}"` : "";
        if (typeof v === "number" && Number.isFinite(v)) {
          xml += `<c r="${ref}"${sAttr}><v>${v}</v></c>`;
        } else {
          xml += `<c r="${ref}"${sAttr} t="inlineStr"><is><t xml:space="preserve">${escapeXml(v)}</t></is></c>`;
        }
      }
      xml += '</row>';
    }
    xml += '</sheetData></worksheet>';
    return xml;
  }

  function buildStylesXml() {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<fonts count="2">' +
        '<font><sz val="11"/><name val="Calibri"/></font>' +
        '<font><b/><sz val="11"/><name val="Calibri"/></font>' +
      '</fonts>' +
      '<fills count="2">' +
        '<fill><patternFill patternType="none"/></fill>' +
        '<fill><patternFill patternType="gray125"/></fill>' +
      '</fills>' +
      '<borders count="1"><border/></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="3">' +
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
        '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>' +
      '</cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
      '</styleSheet>';
  }

  function buildXLSX(sheets) {
    const files = [];

    let ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
    ct += '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">';
    ct += '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>';
    ct += '<Default Extension="xml" ContentType="application/xml"/>';
    ct += '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>';
    ct += '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>';
    for (let i = 0; i < sheets.length; i++) {
      ct += `<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`;
    }
    ct += '</Types>';
    files.push({name: "[Content_Types].xml", data: ct});

    files.push({name: "_rels/.rels", data:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>'
    });

    let wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
    wb += '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">';
    wb += '<sheets>';
    for (let i = 0; i < sheets.length; i++) {
      wb += `<sheet name="${escapeXmlAttr(sheets[i].name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`;
    }
    wb += '</sheets></workbook>';
    files.push({name: "xl/workbook.xml", data: wb});

    let wbRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
    wbRels += '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
    for (let i = 0; i < sheets.length; i++) {
      wbRels += `<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`;
    }
    wbRels += `<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`;
    wbRels += '</Relationships>';
    files.push({name: "xl/_rels/workbook.xml.rels", data: wbRels});

    files.push({name: "xl/styles.xml", data: buildStylesXml()});

    for (let i = 0; i < sheets.length; i++) {
      files.push({name: `xl/worksheets/sheet${i+1}.xml`, data: buildSheetXml(sheets[i])});
    }

    return zipFiles(files);
  }

  // ----------- ZIP (stored, no compression) -----------

  const ZIP_CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) {
      c = (ZIP_CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8)) >>> 0;
    }
    return (c ^ 0xffffffff) >>> 0;
  }

  function zipFiles(files) {
    const enc = new TextEncoder();
    const items = files.map(f => {
      const nameBytes = enc.encode(f.name);
      const dataBytes = enc.encode(f.data);
      return { nameBytes, dataBytes, crc: crc32(dataBytes), size: dataBytes.length, localOffset: 0 };
    });

    let localSize = 0;
    for (const it of items) localSize += 30 + it.nameBytes.length + it.size;
    let cdSize = 0;
    for (const it of items) cdSize += 46 + it.nameBytes.length;
    const totalSize = localSize + cdSize + 22;

    const buf = new Uint8Array(totalSize);
    const dv = new DataView(buf.buffer);
    let off = 0;
    const MOD_DATE = 0x21; // 1980-01-01
    const MOD_TIME = 0;
    const GP_FLAG = 0x0800; // UTF-8 names

    for (const it of items) {
      it.localOffset = off;
      dv.setUint32(off, 0x04034b50, true); off += 4;
      dv.setUint16(off, 20, true); off += 2;
      dv.setUint16(off, GP_FLAG, true); off += 2;
      dv.setUint16(off, 0, true); off += 2;          // method = 0 (stored)
      dv.setUint16(off, MOD_TIME, true); off += 2;
      dv.setUint16(off, MOD_DATE, true); off += 2;
      dv.setUint32(off, it.crc, true); off += 4;
      dv.setUint32(off, it.size, true); off += 4;
      dv.setUint32(off, it.size, true); off += 4;
      dv.setUint16(off, it.nameBytes.length, true); off += 2;
      dv.setUint16(off, 0, true); off += 2;
      buf.set(it.nameBytes, off); off += it.nameBytes.length;
      buf.set(it.dataBytes, off); off += it.size;
    }

    const cdOffset = off;
    for (const it of items) {
      dv.setUint32(off, 0x02014b50, true); off += 4;
      dv.setUint16(off, 20, true); off += 2;          // version made by
      dv.setUint16(off, 20, true); off += 2;          // version needed
      dv.setUint16(off, GP_FLAG, true); off += 2;
      dv.setUint16(off, 0, true); off += 2;
      dv.setUint16(off, MOD_TIME, true); off += 2;
      dv.setUint16(off, MOD_DATE, true); off += 2;
      dv.setUint32(off, it.crc, true); off += 4;
      dv.setUint32(off, it.size, true); off += 4;
      dv.setUint32(off, it.size, true); off += 4;
      dv.setUint16(off, it.nameBytes.length, true); off += 2;
      dv.setUint16(off, 0, true); off += 2;           // extra
      dv.setUint16(off, 0, true); off += 2;           // comment len
      dv.setUint16(off, 0, true); off += 2;           // disk
      dv.setUint16(off, 0, true); off += 2;           // internal attrs
      dv.setUint32(off, 0, true); off += 4;           // external attrs
      dv.setUint32(off, it.localOffset, true); off += 4;
      buf.set(it.nameBytes, off); off += it.nameBytes.length;
    }

    dv.setUint32(off, 0x06054b50, true); off += 4;
    dv.setUint16(off, 0, true); off += 2;
    dv.setUint16(off, 0, true); off += 2;
    dv.setUint16(off, items.length, true); off += 2;
    dv.setUint16(off, items.length, true); off += 2;
    dv.setUint32(off, cdSize, true); off += 4;
    dv.setUint32(off, cdOffset, true); off += 4;
    dv.setUint16(off, 0, true);

    return buf;
  }

  init();
})();
</script>
